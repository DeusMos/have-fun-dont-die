hallmarks:
  - slug: 01-genomic-instability
    name: Genomic instability
    status: rewritten
    one_liner: "DNA lesions, misrepair, chromosomal/mtDNA change, and selected clones accumulate with age; whether ordinary SNV burden is the master clock is a live paper fight."
  - slug: 02-telomere-attrition
    name: Telomere attrition
    status: rewritten
    one_liner: "Telomeres shorten with age and can cause tissue failure at Mendelian extremes; ordinary LTL as a master clock, and lengthening as geroprotection, is a live fight."
  - slug: 03-epigenetic-alterations
    name: Epigenetic alterations
    status: rewritten
    one_liner: "Methylation and chromatin drift with age and later clocks predict death; whether epigenetic information loss is the driver, and clock moves as rejuvenation, is a live fight."
  - slug: 04-loss-of-proteostasis
    name: Loss of proteostasis
    status: rewritten
    one_liner: "Chaperones, UPS, and solubility fail with age and named proteinopathies are causal; a general cleanup score-and-restore product is not a completed human result."
  - slug: 05-disabled-macroautophagy
    name: Disabled macroautophagy
    status: rewritten
    one_liner: "Macroautophagy is a causal lifespan knob in mice; ordinary human flux is not uniformly down, and the 16-hour / spermidine / Mitopure cleanup product is not a completed restoration result."
  - slug: 06-deregulated-nutrient-sensing
    name: Deregulated nutrient sensing
    status: rewritten
    one_liner: "IIS/mTOR/AMPK/sirtuin tone is a causal lifespan knob in animals; weekly rapamycin / metformin-for-the-healthy / NAD stacks are not a completed human restoration result."
  - slug: 07-mitochondrial-dysfunction
    name: Mitochondrial dysfunction
    status: rewritten
    one_liner: "Capacity, clonal mtDNA deletions, and quality control fail with age in tissue-specific ways; Mitopure/NAD/MitoQ/Forzinity/MOTS-c are not a completed human restore result."
  - slug: 08-cellular-senescence
    name: Cellular senescence
    status: rewritten
    one_liner: "p16-high/senescent populations can be causal in mice; human senolytics are n=5–14 pilots plus OA/ITP nulls; Qualia/D+Q/fisetin SKUs are not a completed restore result."
  - slug: 09-stem-cell-exhaustion
    name: Stem-cell exhaustion
    status: rewritten
    one_liner: "Useful regenerative capacity falls with age in tissue-specific ways (HSC function/clonality, MuSC, ISC/HFSC); refill IVs, STEMREGEN, and young plasma are not a completed restore result."
  - slug: 10-altered-intercellular-communication
    name: Altered intercellular communication
    status: rewritten
    one_liner: "Endocrine/neural/EV/SASP-as-signal and circulating factors change with age; young plasma, TPE, and exosome IVs are not a completed human restore result."
  - slug: 11-chronic-inflammation
    name: Chronic inflammation
    status: rewritten
    one_liner: "Sterile low-grade inflammatory tone rises with age and CANTOS moved MACE; hsCRP dashboards, curcumin/SPM stacks, and off-label colchicine/canakinumab/JAKi are not a completed human restore result."
  - slug: 12-dysbiosis
    name: Dysbiosis
    status: rewritten
    one_liner: "Gut communities and functions change with age and mouse transfers can move permeability and progeria lifespan; Viome/Akkermansia/FMT stacks are not a completed human restore result."
  - slug: 13-extracellular-matrix-changes
    name: Extracellular matrix changes
    status: rewritten
    one_liner: "Long-lived collagen accumulates AGEs and stiffness predicts events; collagen/GHK-Cu/AGE-Reader/alagebrium stacks are not a completed human restore result."
  - slug: 14-psychosocial-isolation
    name: Psychosocial isolation
    status: rewritten
    one_liner: "Isolation and loneliness associate with death, CVD, and dementia; residual isolation vs loneliness-NS is a live fight; UCLA-as-CRP, Oxipops, and AI companions are not a completed restore result."

